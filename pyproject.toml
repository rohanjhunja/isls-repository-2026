[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proceedings-ingest"
version = "0.1.0"
description = "Antigravity Proceedings Research System ingestion and extraction engine"
authors = [{ name = "Antigravity Agent" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.10.0",
    "pypdf>=3.15.0",
    "rapidfuzz>=3.0.0",
    "click>=8.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0"
]

[project.scripts]
proceedings = "proceedings_ingest.cli:cli"
